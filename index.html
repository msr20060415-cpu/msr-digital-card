<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101a2b">
<title>کارت ویزیت | محمدصادق رجبی</title>
<style>
:root{--navy:#101a2b;--gold:#e5b85c;--muted:#aab4c4;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#263957 0,#101a2b 58%,#0b1220 100%);color:var(--white);font-family:Tahoma,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(100%,430px);border:1px solid rgba(229,184,92,.35);border-radius:28px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));box-shadow:0 24px 70px #0006}
.top{padding:30px 26px 25px;text-align:center;position:relative}
.brand{position:absolute;top:18px;left:20px;border:1px solid #e5b85c88;color:var(--gold);font-size:12px;letter-spacing:2px;border-radius:9px;padding:7px 10px;font-weight:bold}
.avatar{width:116px;height:116px;border-radius:50%;margin:12px auto 17px;border:2px solid var(--gold);padding:4px;background:#101a2b;box-shadow:0 0 0 7px #e5b85c12;overflow:hidden}
.avatar img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%}
h1{font-size:25px;margin:0 0 9px}
.role{font-size:14px;color:var(--gold);line-height:1.9}
.org{display:inline-block;margin-top:12px;padding:5px 13px;border-radius:99px;background:#e5b85c18;border:1px solid #e5b85c50;color:#f4d99f;font-size:12px;letter-spacing:1px}
.bio{font-size:13px;color:#d1d8e2;line-height:2.1;margin:17px 0 0}
.divider{height:1px;background:linear-gradient(90deg,transparent,#e5b85c77,transparent)}
.content{padding:23px 22px 25px}
.label{font-size:12px;color:var(--muted);margin:0 0 9px}
.info{background:#ffffff08;border:1px solid #ffffff17;border-radius:15px;padding:14px;margin-bottom:13px}
.bankrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bankname{font-weight:bold;font-size:15px}
.owner{font-size:12px;color:var(--muted);margin-top:6px}
.number{direction:ltr;text-align:left;font-size:19px;letter-spacing:1.3px;font-weight:bold;color:#fff;margin:13px 0 12px;word-break:break-word}
button,.linkbtn{appearance:none;border:0;border-radius:12px;padding:12px 14px;font-family:inherit;font-size:13px;font-weight:bold;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .15s,opacity .15s}
button:active,.linkbtn:active{transform:scale(.98)}
.copy{background:var(--gold);color:#182033}
.secondary{background:#ffffff0b;border:1px solid #ffffff24;color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f7f4ed;color:#101a2b;padding:11px 17px;border-radius:99px;font-size:13px;box-shadow:0 8px 25px #0005;display:none;white-space:nowrap}
footer{text-align:center;color:#758196;font-size:11px;padding:0 15px 20px}
@media(max-width:380px){body{padding:12px}.top{padding-inline:18px}.content{padding:20px 16px}.number{font-size:17px}}
</style>
</head>

      <a class="linkbtn secondary" id="callLink" href="tel:09206209252">☎ تماس با من</a>
      <button class="secondary" onclick="sharePage()">↗ اشتراک‌گذاری</button>
    </div>
  </section>
  <footer>Digital Business Card · MSR</footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const CARD_NUMBER = "6219861808825573";
function showToast(message){
  const el=document.getElementById("toast"); el.textContent=message; el.style.display="block";
  clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>el.style.display="none",2200);
}
async function copyCard(){
  try { await navigator.clipboard.writeText(CARD_NUMBER); showToast("شماره کارت کپی شد"); }
  catch(e) {
    const t=document.createElement("textarea"); t.value=CARD_NUMBER; document.body.appendChild(t);
    t.select(); try{document.execCommand("copy");showToast("شماره کارت کپی شد")}catch(_){showToast("شماره کارت: "+CARD_NUMBER)}
    t.remove();
  }
}
async function sharePage(){
  const message = [
    "💠 کارت ویزیت دیجیتال | MSR",
    "",
    "👤 محمدصادق رجبی",
    "🎓 دانشجوی پزشکی دانشگاه علوم پزشکی شهید بهشتی",
    "🏅 رتبه ۲۹۲ کنکور ۱۴۰۳",
    "📚 مشاوره تحصیلی و تدریس زیست‌شناسی",
    "",
    "💳 اطلاعات کارت بانکی",
    "بانک سامان",
    "به نام: محمدصادق رجبی",
    "شماره کارت: 6219 8618 0882 5573",
    "",
    "☎ شماره تماس: 09206209252"
  ].join("\n");

  // ابتدا از پنل اشتراک‌گذاری خود اندروید استفاده کن تا کاربر بتواند اپ تلگرام را انتخاب کند.
  if (navigator.share) {
    try {
      await navigator.share({ title: "کارت ویزیت MSR", text: message });
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
  }

  // در مرورگرهایی که Web Share API ندارند، روش جایگزین تلگرام را باز کن.
  const telegramUrl = "https://t.me/share/url?text=" + encodeURIComponent(message);
  window.location.href = telegramUrl;
}
</script>
